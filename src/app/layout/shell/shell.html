<div class="shell" [class.sidebar-open]="sidebarOpen()">
  <!-- Overlay -->
  <div class="sidebar-overlay" (click)="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/>
          </svg>
        </div>
        <span>DAMRO</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <span class="nav-label">Main</span>
        <a routerLink="/dashboard" routerLinkActive="active" (click)="closeSidebar()" class="nav-item" id="nav-dashboard">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          <span>Dashboard</span>
        </a>
        <a routerLink="/attendance" routerLinkActive="active" (click)="closeSidebar()" class="nav-item" id="nav-attendance">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
          <span>Attendance</span>
        </a>
        <a routerLink="/leaves" routerLinkActive="active" (click)="closeSidebar()" class="nav-item" id="nav-leaves">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span>Leave</span>
        </a>
        <a routerLink="/summary" routerLinkActive="active" (click)="closeSidebar()" class="nav-item" id="nav-summary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span>Monthly Summary</span>
        </a>
      </div>

      @if (auth.isAdmin()) {
        <div class="nav-section">
          <span class="nav-label">Admin</span>
          <a routerLink="/admin" routerLinkActive="active" (click)="closeSidebar()" class="nav-item" id="nav-admin">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            <span>Admin Panel</span>
          </a>
        </div>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar-sm">{{ initials }}</div>
        <div class="user-details">
          <span class="user-name">{{ auth.userProfile()?.name }}</span>
          <span class="user-role">{{ auth.userProfile()?.role }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" id="btn-logout" title="Logout">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="main-area">
    <!-- Top bar -->
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleSidebar()" id="btn-menu-toggle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="topbar-right">
        <div class="topbar-avatar">{{ initials }}</div>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
